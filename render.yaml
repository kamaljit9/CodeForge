services:
  - type: web
    name: codeforge
    env: python
    buildCommand: pip install -r requirements.txt && python create_db.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codeforge-db
          property: connectionString

databases:
  - name: codeforge-db
    databaseName: codeforge
    user: codeforge_user
